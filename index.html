<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>색감 스터디 주제 생성기</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#232b45;background:#f4f5fa}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1020px;margin:auto}h1{margin:0;font-size:30px}p{color:#687189}.panel{background:white;border:1px solid #e1e4ef;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 6px 25px #28345b0b}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}button{border:0;background:#283b94;color:white;padding:12px 18px;border-radius:10px;font-size:15px;cursor:pointer}button.secondary{background:#edf0fa;color:#25336e}button:hover{filter:brightness(1.08)}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:650}.field select{width:100%;padding:11px;border:1px solid #d8deeb;border-radius:9px;background:white;color:#232b45}.field label{font-size:12px;color:#69748c;font-weight:400}.heading{font-size:13px;letter-spacing:.1em;color:#7a849a;font-weight:750;margin:0 0 9px}.big{font-size:27px;font-weight:780;line-height:1.4;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.datum{padding:15px;background:#f6f7fb;border-radius:12px}.datum strong{display:block;margin-top:6px;font-size:19px}.swatches{display:flex;gap:8px;margin:15px 0 8px}.swatch{flex:1;min-width:0;cursor:pointer}.color{height:104px;border-radius:10px;border:1px solid #0001}.hex{text-align:center;font-size:12px;margin-top:8px;color:#626b80}.note{font-size:12px;color:#7c859a}.buttons{display:flex;gap:10px;flex-wrap:wrap}.history{display:flex;flex-direction:column;gap:9px}.history-item{border:1px solid #e1e4ef;padding:12px;border-radius:10px;cursor:pointer;background:#fff;text-align:left;color:#263151}.footer{text-align:center;font-size:12px;margin:25px}.tag{display:inline-block;background:#eaf0ff;color:#28458d;padding:6px 10px;border-radius:30px;font-size:12px;margin-bottom:12px}@media(max-width:620px){body{padding:14px}.grid{grid-template-columns:1fr}.big{font-size:23px}.color{height:75px}}
</style></head><body><main><div class="top"><div><h1>🎨 색감 스터디 주제 생성기</h1><p>색 · 장소 · 시간 · 계절 · 특별 조건을 조합해 오늘의 한 장을 만들어 보세요.</p></div><span class="tag">COLOR STUDY LAB · v1</span></div>
<section class="panel"><div class="top"><h2 style="margin:0;font-size:19px">생성 설정</h2><div class="buttons"><button id="generate">🎲 새로운 주제 생성</button><button class="secondary" id="copy">📋 주제 복사</button></div></div><div class="controls" style="margin-top:20px"><div class="field">팔레트 색상 수<select id="count"><option value="3">3색</option><option value="4">4색</option><option value="5" selected>5색</option></select></div><div class="field">색감 분위기<select id="mood"><option value="random">완전 랜덤</option><option value="vivid">선명하고 화사하게</option><option value="muted">저채도·차분하게</option><option value="dream">몽환적인 색감</option><option value="contrast">강한 색상 대비</option></select></div><div class="field">장소 고정<select id="place"><option value="random">랜덤</option></select></div><div class="field">시간대 고정<select id="time"><option value="random">랜덤</option></select></div><div class="field">계절 고정<select id="season"><option value="random">랜덤</option></select></div><div class="field">날씨 고정<select id="weather"><option value="random">랜덤</option></select></div></div></section>
<section class="panel" id="result"><div class="heading">TODAY'S COLOR STUDY</div><div class="big" id="title"></div><div class="grid"><div class="datum"><span class="heading">장소 / 주제</span><strong id="placeValue"></strong></div><div class="datum"><span class="heading">시간 / 계절 / 날씨</span><strong id="atmosValue"></strong></div><div class="datum"><span class="heading">특수 조건 · 오브젝트</span><strong id="objectValue"></strong></div><div class="datum"><span class="heading">특수 조건 · 연출 / 지역</span><strong id="twistValue"></strong></div></div><h3 style="margin-bottom:8px">오늘의 팔레트 <small class="note">(색상을 누르면 HEX 복사)</small></h3><div class="swatches" id="swatches"></div><p class="note" id="description"></p><div class="buttons"><button class="secondary" id="palette">🎨 팔레트만 다시 뽑기</button><button class="secondary" id="save">⭐ 결과 저장</button><button class="secondary" id="export">🖼️ PNG 카드 저장</button></div></section>
<section class="panel"><h2 style="margin-top:0;font-size:18px">최근 저장한 주제</h2><div class="history" id="history"><span class="note">저장한 주제가 여기에 표시됩니다.</span></div></section><div class="footer">저장 목록은 이 브라우저에만 보관됩니다. 새로고침해도 유지됩니다.</div></main>
<script>
const places=['학교 화장실','공중화장실','낡은 놀이터','주택가 골목','지하철 플랫폼','버스 정류장','편의점','옥상','실내 수영장','폐교 복도','지하상가','세탁소','작은 도서관','아파트 계단','육교','바닷가 주차장','공항 대합실','온실','골목의 자판기','동네 목욕탕','학교 급식실','오래된 영화관','주택가 공터','폐업한 오락실','작은 항구','아파트 단지 놀이터','기차 내부','시장 골목','우체국','낡은 엘리베이터'];
const times=['새벽 4시','아침 7시','오전 10시','정오','오후 2~3시','오후 5시','해 질 무렵','블루아워','밤 9시','자정'];const seasons=['봄','초여름','한여름','가을','늦가을','겨울'];const weathers=['맑음','구름 많음','비가 막 그친 날','소나기','안개','눈 내림','흐림','강한 햇빛'];
const objects=['동물 한 마리','빨간 우산','낡은 TV','고장 난 자판기','수족관','투명한 비닐봉지','꽃 한 송이','자전거','종이비행기','공중전화','운동화 한 짝','풍선 세 개','작은 선풍기','빈 의자 두 개','초록색 유리병','버려진 인형','시계','금속 표지판','노란 장화','물웅덩이','카세트 플레이어','길고양이','낡은 우편함','흰 천','작은 나무'];
const twists=['인물 없이 표현하기','소년 한 명만 배치하기','일본의 작은 지방 도시','홍콩의 오래된 주택가','한국의 1990년대 동네','유럽의 해안 소도시','모든 조명을 인공광으로','반사광을 강조하기','보색 대비 사용하기','역광으로만 표현하기','유리 또는 거울을 반드시 넣기','식물이 공간을 조금 침범하게 하기','그림자는 보라색 계열로','수면 반사 넣기','비현실적인 하늘색 사용하기','한 가지 색만 강한 포인트로','기묘한 물체 하나 숨기기','광각 원근 사용하기','아주 높은 시점으로 그리기','대칭 구도로 표현하기','일상적인 공간에 이상한 문 하나','빛은 밝지만 쓸쓸한 분위기'];
const titles=['아무도 없는 {place}의 {time}','{season}이 끝나지 않는 {place}','마지막으로 불이 켜진 {place}','오늘도 평범한 {place}','기억 속의 {weather}','우리가 떠난 뒤의 {place}','{time}, 아무 일도 일어나지 않았다','이곳의 계절은 {season}에 멈췄다'];
const pick=a=>a[Math.floor(Math.random()*a.length)];const rnd=(a,b)=>a+Math.random()*(b-a);const hex=(h,s,l)=>{let f=n=>{let k=(n+h/30)%12;let a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()};
function makePalette(){let mood=document.getElementById('mood').value;let base=rnd(0,360),n=+document.getElementById('count').value;return Array.from({length:n},(_,i)=>{let h=(base+(mood==='contrast'?(i%2?175:0):mood==='dream'?i*27:mood==='muted'?i*18:i*37)+rnd(-12,12)+360)%360;let s=mood==='muted'?rnd(.19,.39):mood==='vivid'?rnd(.62,.86):mood==='dream'?rnd(.35,.66):mood==='contrast'?rnd(.55,.8):rnd(.34,.76);let l=mood==='muted'?rnd(.39,.74):mood==='vivid'?rnd(.48,.72):rnd(.38,.78);return hex(h,s,l)})}
function fillSelect(id,values){let el=document.getElementById(id);values.forEach(v=>el.add(new Option(v,v)))}fillSelect('place',places);fillSelect('time',times);fillSelect('season',seasons);fillSelect('weather',weathers);let current=null;
function selectValue(id,values){let v=document.getElementById(id).value;return v==='random'?pick(values):v}function draw(){document.getElementById('title').textContent=current.title;document.getElementById('placeValue').textContent=current.place;document.getElementById('atmosValue').textContent=[current.time,current.season,current.weather].join(' · ');document.getElementById('objectValue').textContent=current.object;document.getElementById('twistValue').textContent=current.twist;document.getElementById('description').textContent='장면을 '+current.colors.length+'가지 중심 색상으로 표현해 보세요. 필요하다면 명도와 채도 변형은 자유롭게 사용할 수 있습니다.';document.getElementById('swatches').innerHTML='';current.colors.forEach(c=>{let div=document.createElement('div');div.className='swatch';div.innerHTML=`<div class="color" style="background:${c}"></div><div class="hex">${c}</div>`;div.onclick=()=>navigator.clipboard.writeText(c).then(()=>toast(c+' 복사됨')).catch(()=>{});document.getElementById('swatches').appendChild(div)})}
function generate(){let place=selectValue('place',places),time=selectValue('time',times),season=selectValue('season',seasons),weather=selectValue('weather',weathers);current={place,time,season,weather,object:pick(objects),twist:pick(twists),colors:makePalette()};current.title=pick(titles).replaceAll('{place}',place).replaceAll('{time}',time).replaceAll('{season}',season).replaceAll('{weather}',weather);draw()}
function asText(c){return `색감 스터디 주제\n${c.title}\n장소: ${c.place}\n시간대: ${c.time}\n계절: ${c.season}\n날씨: ${c.weather}\n특수 조건: ${c.object} / ${c.twist}\n팔레트: ${c.colors.join(', ')}`};function toast(s){let old=document.title;document.title='✓ '+s;setTimeout(()=>document.title=old,1400)}
document.getElementById('generate').onclick=generate;document.getElementById('palette').onclick=()=>{current.colors=makePalette();draw()};document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(asText(current)).then(()=>toast('주제 복사됨'));document.getElementById('save').onclick=()=>{let a=JSON.parse(localStorage.getItem('colorStudyHistory')||'[]');a.unshift({...current});localStorage.setItem('colorStudyHistory',JSON.stringify(a.slice(0,20)));historyRender();toast('저장됨')};function historyRender(){let a=JSON.parse(localStorage.getItem('colorStudyHistory')||'[]'),h=document.getElementById('history');h.innerHTML='';if(!a.length){h.innerHTML='<span class="note">저장한 주제가 여기에 표시됩니다.</span>';return}a.forEach((c,i)=>{let b=document.createElement('button');b.className='history-item';b.textContent=`${i+1}. ${c.title} · ${c.colors.join(' ')}`;b.onclick=()=>{current=c;draw();window.scrollTo({top:0,behavior:'smooth'})};h.appendChild(b)})}historyRender();
document.getElementById('export').onclick=()=>{let canvas=document.createElement('canvas');canvas.width=1200;canvas.height=820;let ctx=canvas.getContext('2d');ctx.fillStyle='#f6f7fb';ctx.fillRect(0,0,1200,820);ctx.fillStyle='#24367f';ctx.font='bold 38px sans-serif';ctx.fillText('COLOR STUDY / 색감 스터디',65,90);ctx.fillStyle='#232b45';ctx.font='bold 44px sans-serif';ctx.fillText(current.title.slice(0,25),65,170);ctx.font='26px sans-serif';[`${current.place} · ${current.time}`,`${current.season} · ${current.weather}`,`오브젝트: ${current.object}`,`추가 조건: ${current.twist}`].forEach((s,i)=>ctx.fillText(s,65,245+i*62));let w=1060/current.colors.length;current.colors.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(65+i*w,535,w-9,175);ctx.fillStyle='#263151';ctx.font='22px monospace';ctx.fillText(c,65+i*w,753)});let a=document.createElement('a');a.download='color-study-prompt.png';a.href=canvas.toDataURL('image/png');a.click()};generate();
</script></body></html>
