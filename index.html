<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ed"><meta name="description" content="Ryepe's Color Study — a multilingual illustration prompt and color palette generator.">
<title>Ryepe's Color Study</title>
<style>
:root{--ink:#252b2b;--muted:#747b78;--line:#dedfd8;--paper:#f6f5ef;--white:#fffefa;--accent:#526e67;--soft:#e7ece7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans JP",sans-serif;line-height:1.5}
.wrap{max-width:1110px;margin:auto;padding:36px 24px 70px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.brand{font-size:12px;letter-spacing:.19em;font-weight:750;color:var(--accent)}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.055em;line-height:1.15;margin:8px 0}header p{margin:0;color:var(--muted);font-size:14px}
select,button{font:inherit}select{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);max-width:100%}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button{border:1px solid transparent;background:var(--accent);color:#fff;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(.94)}button:focus-visible,select:focus-visible{outline:3px solid #a6bdb3;outline-offset:2px}
button.ghost{background:var(--soft);color:#38564d}button.outline{background:transparent;color:var(--ink);border-color:var(--line)}
button.small{padding:6px 10px;font-size:12px}button.lock{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 9px;font-size:14px}
button.lock.on{background:var(--accent);color:white;border-color:var(--accent)}.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:750;text-transform:uppercase}
h2{margin:4px 0 14px;font-size:23px;letter-spacing:-.035em}.challenge{font-size:clamp(21px,3vw,31px);font-weight:750;line-height:1.35;letter-spacing:-.035em;margin:12px 0 22px}
.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.detail{background:#f5f6f1;border-radius:12px;padding:13px;min-width:0}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:9px}.detail-name{font-size:12px;color:var(--muted)}.detail-value{font-size:16px;font-weight:700;word-break:keep-all}
.detail-actions{display:flex;gap:4px}.detail-actions button{min-width:30px}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:16px 0}.swatch{padding:0;border:0;background:transparent;color:var(--ink);text-align:left;min-width:0}
.color{height:125px;border-radius:9px;border:1px solid #0000000c}.hex{font-size:12px;margin-top:8px;font-family:ui-monospace,monospace;letter-spacing:-.02em}
.note{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.history{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.history button{text-align:left;background:#f4f6f1;color:var(--ink);border:1px solid var(--line);font-size:13px;overflow:hidden}
.history-swatch{display:flex;gap:3px;margin-top:7px}.history-swatch span{height:12px;flex:1;border-radius:3px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263c35;color:white;padding:10px 17px;border-radius:12px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:700px){.wrap{padding:20px 13px 45px}.card{padding:16px}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings{grid-template-columns:1fr 1fr}.history{grid-template-columns:1fr}.color{height:86px}.swatches{gap:5px}.hex{font-size:10px}}
@media(max-width:370px){.detail-grid{grid-template-columns:1fr}.settings{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><div><div class="brand">RYEPE / COLOR ATELIER</div><h1>Color Study</h1><p id="subtitle"></p></div><label class="field"><span id="languageLabel"></span><select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></label></header>
<section class="card"><div class="section-head"><div><div class="eyebrow">01 / SETTINGS</div><h2 id="settingsTitle"></h2></div><div class="row"><button id="daily" class="outline"></button><button id="generate"></button></div></div><div class="settings">
<label class="field"><span id="countLabel"></span><select id="count"><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option></select></label>
<label class="field"><span id="moodLabel"></span><select id="mood"></select></label>
<label class="field"><span id="harmonyLabel"></span><select id="harmony"></select></label>
<label class="field"><span id="intensityLabel"></span><select id="intensity"></select></label>
</div></section>
<section class="card" id="result"><div class="eyebrow">02 / TODAY'S CHALLENGE</div><div class="challenge" id="title"></div><div id="dailyNote" class="note" hidden></div>
<div class="detail-grid" id="details"></div>
<div class="section-head" style="margin-top:25px"><div><div class="eyebrow">03 / PALETTE</div><h2 id="paletteTitle" style="margin-bottom:0"></h2></div><div class="row"><button class="ghost small" id="rerollPalette"></button><button class="lock" id="paletteLock" title="Lock palette" aria-label="Lock palette">♧</button></div></div>
<div class="swatches" id="swatches"></div><div class="note" id="paletteHint"></div>
<div class="row" style="margin-top:24px"><button class="ghost" id="copy"></button><button class="ghost" id="save"></button><button class="outline" id="export"></button></div>
</section>
<section class="card"><div class="section-head"><div><div class="eyebrow">04 / ARCHIVE</div><h2 id="historyTitle"></h2></div><button class="outline small" id="clear"></button></div><div class="history" id="history"></div></section>
<footer id="footer"></footer></div><div class="toast" id="toast" role="status"></div>

const $=id=>document.getElementById(id),pick=(a,rng=Math.random)=>Math.floor(rng()*a.length),rand=(a,b,rng=Math.random)=>a+rng()*(b-a);

function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function hslHex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;let a=s*Math.min(l,1-l);let f=n=>{let k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return "#"+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase()}
